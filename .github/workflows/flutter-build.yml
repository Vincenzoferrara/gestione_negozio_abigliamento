name: Flutter Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'
  PROJECT_PATH: src/gestione_negozio_app
  REPORT_REPO: ${{ vars.REPORT_REPO || 'Vincenzoferrara/report_flutter' }}
  REPORT_REF: ${{ vars.REPORT_REF || 'ci/report-deps-update' }}
  ADS_CONNECTOR_REPO: ${{ vars.ADS_CONNECTOR_REPO || 'Vincenzoferrara/ads_connector_flutter' }}

jobs:
  resolve-version:
    name: Resolve app version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_build: ${{ steps.version.outputs.version_build }}
      version_full: ${{ steps.version.outputs.version_full }}

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJECT_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            /*
            !/docker/
          sparse-checkout-cone-mode: false

      - name: Resolve and optionally bump pubspec build number
        id: version
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          SHOULD_BUMP: >-
            ${{ github.event_name == 'push' &&
                github.actor != 'github-actions[bot]' &&
                !contains(github.event.head_commit.message, '[skip ci]') }}
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_value=${version_line#version: }
          version_name=${version_value%%+*}
          current_build=${version_value#*+}

          if [ "$current_build" = "$version_value" ]; then
            current_build=0
          fi

          if [ "$SHOULD_BUMP" = "true" ]; then
            version_build=$((current_build + 1))
            sed -i "s/^version:.*/version: ${version_name}+${version_build}/" pubspec.yaml
            did_bump=true
          else
            version_build=$current_build
            did_bump=false
          fi

          version_full="${version_name}+${version_build}"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_build=${version_build}" >> "$GITHUB_OUTPUT"
          echo "version_full=${version_full}" >> "$GITHUB_OUTPUT"
          echo "did_bump=${did_bump}" >> "$GITHUB_OUTPUT"

      - name: Commit bumped version
        if: ${{ steps.version.outputs.did_bump == 'true' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if git diff --quiet -- pubspec.yaml; then
            echo "No version change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump app version to ${{ steps.version.outputs.version_full }} [skip ci]"
          git push

  build:
    name: Build ${{ matrix.target.name }}
    needs: resolve-version
    runs-on: ${{ matrix.target.os }}
    env:
      APP_VERSION_NAME: ${{ needs.resolve-version.outputs.version_name }}
      APP_VERSION_BUILD: ${{ needs.resolve-version.outputs.version_build }}
      APP_VERSION_FULL: ${{ needs.resolve-version.outputs.version_full }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Android APK
            os: ubuntu-latest
            platform: android
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
          - name: Linux Desktop
            os: ubuntu-latest
            platform: linux
            artifact_path: build/linux/x64/release/bundle
          - name: Windows Desktop
            os: windows-latest
            platform: windows
            artifact_path: build/windows/x64/runner/Release
          - name: macOS Desktop
            os: macos-latest
            platform: macos
            artifact_path: build/macos/Build/Products/Release

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
        with:
          path: ${{ env.PROJECT_PATH }}
          sparse-checkout: |
            /*
            !/docker/
          sparse-checkout-cone-mode: false

      - name: Checkout local package report
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPORT_REPO }}
          ref: ${{ env.REPORT_REF }}
          path: report

      - name: Checkout local package ads_connector_flutter
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ADS_CONNECTOR_REPO }}
          path: ads_connector_flutter

      - name: Verify external local packages
        run: |
          missing=0
          for dir in report ads_connector_flutter; do
            if [ ! -d "$GITHUB_WORKSPACE/$dir" ]; then
              echo "::error::Missing local package '$dir'. Set repository variable '$([ "$dir" = report ] && printf REPORT_REPO || printf ADS_CONNECTOR_REPO)' to owner/repo or vendor the package into this repository."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Java
        if: ${{ matrix.target.platform == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android signing if secrets are available
        if: ${{ matrix.target.platform == 'android' }}
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Android signing secrets not fully configured; building unsigned Android artifact."
            exit 0
          fi

          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=app/release.jks\n'
          } > android/key.properties

      - name: Install Linux build dependencies
        if: ${{ matrix.target.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable desktop platforms
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop

      - name: Apply resolved build version
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          perl -0pi -e 's/^version:.*/version: $ENV{APP_VERSION_FULL}/m' pubspec.yaml

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Analyze project
        continue-on-error: true
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter analyze

      - name: Build Android APK
        if: ${{ matrix.target.platform == 'android' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build apk --release --build-name "$APP_VERSION_NAME" --build-number "$APP_VERSION_BUILD"

      - name: Build Linux desktop bundle
        if: ${{ matrix.target.platform == 'linux' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build linux --release --build-name "$APP_VERSION_NAME" --build-number "$APP_VERSION_BUILD"

      - name: Build Windows desktop bundle
        if: ${{ matrix.target.platform == 'windows' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build windows --release --build-name "$APP_VERSION_NAME" --build-number "$APP_VERSION_BUILD"

      - name: Build macOS desktop app
        if: ${{ matrix.target.platform == 'macos' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build macos --release --build-name "$APP_VERSION_NAME" --build-number "$APP_VERSION_BUILD"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.platform }}-build
          path: ${{ env.PROJECT_PATH }}/${{ matrix.target.artifact_path }}
          if-no-files-found: error
