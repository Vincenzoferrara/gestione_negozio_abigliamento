name: Flutter Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.1'
  PROJECT_PATH: src/gestione_negozio_app

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Android APK
            os: ubuntu-latest
            platform: android
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
          - name: Linux Desktop
            os: ubuntu-latest
            platform: linux
            artifact_path: build/linux/x64/release/bundle
          - name: Windows Desktop
            os: windows-latest
            platform: windows
            artifact_path: build/windows/x64/runner/Release
          - name: macOS Desktop
            os: macos-latest
            platform: macos
            artifact_path: build/macos/Build/Products/Release

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_PATH }}

      - name: Checkout local package report
        if: ${{ vars.REPORT_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPORT_REPO }}
          path: report

      - name: Checkout local package ads_connector_flutter
        if: ${{ vars.ADS_CONNECTOR_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ADS_CONNECTOR_REPO }}
          path: ads_connector_flutter

      - name: Verify external local packages
        run: |
          missing=0
          for dir in report ads_connector_flutter; do
            if [ ! -d "$GITHUB_WORKSPACE/$dir" ]; then
              echo "::error::Missing local package '$dir'. Set repository variable '$([ "$dir" = report ] && printf REPORT_REPO || printf ADS_CONNECTOR_REPO)' to owner/repo or vendor the package into this repository."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Java
        if: ${{ matrix.target.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux build dependencies
        if: ${{ matrix.target.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable desktop platforms
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter analyze

      - name: Build Android APK
        if: ${{ matrix.target.platform == 'android' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build apk --release

      - name: Build Linux desktop bundle
        if: ${{ matrix.target.platform == 'linux' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build linux --release

      - name: Build Windows desktop bundle
        if: ${{ matrix.target.platform == 'windows' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build windows --release

      - name: Build macOS desktop app
        if: ${{ matrix.target.platform == 'macos' }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build macos --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.platform }}-build
          path: ${{ env.PROJECT_PATH }}/${{ matrix.target.artifact_path }}
          if-no-files-found: error
