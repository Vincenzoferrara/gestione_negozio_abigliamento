version: "3.9"
services:
    db:
        image: mariadb:10.6
        container_name: wordpress_db
        #restart: always
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
            MYSQL_USER: ${MYSQL_USER:-wordpress}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
        volumes:
            - ./db_data:/var/lib/mysql

    wordpress:
        image: wordpress:latest
        container_name: wordpress_app
        #restart: always
        depends_on:
            - db
        ports:
            - "0.0.0.0:8080:80"
        environment:
            WORDPRESS_DB_HOST: db:3306
            WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
            WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
            WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
            WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?Set WORDPRESS_ADMIN_USER in .env}
            WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?Set WORDPRESS_ADMIN_PASSWORD in .env}
            WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.local}
            WORDPRESS_TITLE: ${WORDPRESS_TITLE:-WooCommerce Test Site}
        volumes:
            - ./wordpress_core:/var/www/html
            - ./wordpress_plugins:/var/www/html/wp-content/plugins
            - /home/vincenzo/Desktop/softwere/gestione_negozio_abbigliamento/MG-Warehouse-Stock-plugin-wordpress:/var/www/html/wp-content/plugins/mg-warehouse-stock
            - ./wordpress_themes:/var/www/html/wp-content/themes
            - ./wordpress_uploads:/var/www/html/wp-content/uploads
            - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: wordpress_phpmyadmin
        profiles: ["tools"]
        #restart: always
        ports:
            - "127.0.0.1:8081:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    #non funziona da errore sulla porta 80 bho
    #filebrowser:
    #    image: filebrowser/filebrowser:latest
    #    container_name: filebrowser
    #   #restart: "no"
    #   ports:
    #        - "8083:80"
